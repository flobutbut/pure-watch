<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Épure</title>
    <style>
      /* Écran de chargement en ligne : visible avant tout JavaScript (plan d'action §1.4). */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #e5e5e3;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        transition: opacity 400ms cubic-bezier(0.2, 0, 0, 1);
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      #boot svg {
        width: 96px;
        height: 96px;
      }
      #boot circle {
        fill: none;
        stroke: #1b1f27;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-dasharray: 289;
        stroke-dashoffset: 289;
        animation: boot-draw 1.6s cubic-bezier(0.4, 0, 0, 1) infinite;
      }
      @keyframes boot-draw {
        60%,
        100% {
          stroke-dashoffset: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot circle {
          animation: none;
          stroke-dashoffset: 0;
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" /></svg>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
